<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluewater Support Tool Editor</title>

</head>

      </svg>
      <span class="ed-title">Support Tool Editor</span>
    </div>

    <div class="ed-loadbar">
      <select id="productSel" class="ed-select" title="Product"></select>
      <select id="langSel" class="ed-select" title="Language"></select>
      <button id="loadLocal" class="ed-btn" title="Load from data/ folder">Load local</button>
      <button id="loadRemote" class="ed-btn" title="Load from Supabase bucket">Load remote</button>
      <label class="ed-btn ed-file">Open file…<input type="file" id="filePicker" accept=".json" hidden></label>
      <span class="ed-sep"></span>
      <select id="parityBaseSel" class="ed-select" title="Compare against (parity base)"></select>
      <button id="runLint" class="ed-btn">Validate</button>
      <span class="ed-sep"></span>
      <button id="exportBtn" class="ed-btn ed-btn-primary" title="Download JSON">Export JSON</button>
      <button id="deployBtn" class="ed-btn" title="Deploy to bucket (needs approval)">Deploy…</button>
    </div>
    <div class="ed-status" id="statusBar">No knowledge base loaded.</div>
  </header>

  <main class="ed-main">
    <section class="ed-graph-wrap">
      <div class="ed-graph-toolbar">
        <input type="text" id="searchBox" class="ed-search" placeholder="Search nodes…">
        <select id="issueFilter" class="ed-select"><option value="">All issues</option></select>
        <label class="ed-check"><input type="checkbox" id="showUnreachable"> dim unreachable</label>
        <button id="relayout" class="ed-btn ed-btn-sm">Re-layout</button>
        <button id="fitBtn" class="ed-btn ed-btn-sm">Fit</button>
        <span class="ed-legend">
          <i class="lg lg-start"></i>start
          <i class="lg lg-step"></i>step
          <i class="lg lg-sol"></i>solution
          <i class="lg lg-ok"></i>resolved
          <i class="lg lg-bad"></i>not resolved
        </span>
      </div>
      <div id="cy"></div>
    </section>

    <aside class="ed-panel" id="panel">
      <div class="ed-panel-empty">Select a node to edit it.</div>
    </aside>
  </main>

  <section class="ed-lint" id="lintDrawer">
    <div class="ed-lint-head">
      <button id="lintToggle" class="ed-btn ed-btn-sm">Validation</button>
      <span id="lintSummary" class="ed-lint-summary">Not run.</span>
      <div class="ed-lint-filters">
        <label class="ed-check"><input type="checkbox" id="fError" checked> errors</label>
        <label class="ed-check"><input type="checkbox" id="fWarn" checked> warnings</label>
        <label class="ed-check"><input type="checkbox" id="fInfo"> info</label>
      </div>
    </div>
    <div id="lintList" class="ed-lint-list"></div>
  </section>

  <!-- Graph engine -->
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <!-- Shared schema (single source of truth, also used by ../app.js) -->
  <script src="../schema/kb-schema.js"></script>
  <!-- Editor -->
  <script src="graph.js"></script>
  <script src="panel.js"></script>
  <script src="lint.js"></script>
  <script src="deploy.js"></script>
  <script src="editor.js"></script>
</body>
</html>
