<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Station Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" id="logoHome" style="cursor:pointer;">
        <span class="logo-blue">Bluewater</span>
        <span class="logo-sub"><span class="logo-cafe">Café</span> Station Support</span>
      </div>
      <div class="lang-switcher" id="langSwitcher">
        <button class="lang-btn" id="langBtn">
          <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span id="currentLangLabel">SV</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <input type="text" class="lang-search" id="langSearch" placeholder="Search...">
          <div class="lang-list" id="langList"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="card" id="card"></div>
  </main>

  <footer>
    <p>&copy; 2026 Bluewater Group</p>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
